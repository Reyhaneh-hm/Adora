<!doctype html>
<html lang="fa">

<head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing page</title>
</head>

<body>

    <section class="page-landing d-flex align-items-center justify-content-center">
        <div class="card d-flex align-items-center flex-column">
            <header class="header d-flex align-items-center justify-content-between">
                <div class="menu d-flex align-items-center justify-content-center">
                    <img src="./public/img/landing/Group.svg" class="logo" alt="logo">
                    <ul class="items-box">
                        <li class="item"><a href="#" class="action">ورود / ثبت نام</a></li>
                        <li class="item"><a href="#" class="action">راهنمای آدورا</a></li>
                        <li class="item"><a href="#" class="action">آکادمی</a></li>
                        <li class="item"><a href="#" class="action">تماس با ما</a></li>
                    </ul>
                </div>
                <div class="content">
                    <span class="name">Adora</span>
                    <p class="text">Shop Smart</p>
                </div>
            </header>
            <div class="contents d-flex align-items-center flex-column">
                <h2 class="title">هر فروشگاه یک داستان است</h2>
                <span class="text">داستان خودت را بساز
                    <a href="#" class="action">شروع کنید</a>
                </span>
            </div>

            <div class="info-subject">
                <div class="box-imgPhone">
                    <img src="/img/landing/Phone.png" class="img" alt="Phone">
                </div>
                <div class="box-shoes d-flex flex-column align-items-center justify-content-center">
                    <div class="status d-flex align-items-center justify-content-center">
                        <div class="sum-visit">
                            <p class="number"><span>بازدید</span>۱۲۰۳</p>
                            <p class="desc">مجموع تعداد بازدید</p>
                        </div>
                        <div class="image-shoes">
                            <img src="/public/img/landing/shoes.png" class="img" alt="shoes">
                        </div>
                        <div class="sum-buy">
                            <p class="number">۵۶۴ <span>خرید</span></p>
                            <p class="desc">مجموع تعداد خزید</p>
                        </div>
                    </div>
                    <div class="text-box d-flex align-items-center flex-column">
                        <p class="product-type">کفش اسپورت سبز رنگ</p>
                        <p class="desc"><span>۷۴.۳٪</span>از افرادی که این محصول را دیده اند آن را خریده اند </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="/main.js"></script>
    <script type="module" src="/src/js/pages/landing/landing.js"></script>
</body>

</html>
